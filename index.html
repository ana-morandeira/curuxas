:root{--bg:#efe3c8;--ink:#3b2f22;--moss:#5f6e3a;--dusk:#4a3524;--amber:#c9972f;--line:#cdb88a;--red:#8c2f26;

*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg)}
#app{display:flex;flex-direction:column;height:100%}
header{padding:12px 18px;background:var(--dusk);color:var(--bg);display:flex;justify-content:space-between;align-items:baseline;gap:12px}

.meta{font-size:.85rem;color:#58604f;margin-bottom:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button,a.btn{font:600 .95rem var(--sans);min-height:46px;padding:10px 14px;border-radius:0;border:1px solid var(--dusk);background:transparent;color:var(--dusk);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center}

button.on{background:var(--moss);border-color:var(--moss);color:#fff}

.box{background:#e4d3ab;border-left:2px solid var(--moss);padding:10px 12px;border-radius:0;font-size:.92rem;margin-bottom:12px}
.box.arrive{background:#f0d98f;border-color:var(--amber);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:focus-visible{outline:3px solid var(--amber)}
.num{flex:none;width:30px;height:30px;border-radius:0;background:var(--dusk);color:var(--bg);display:grid;place-items:center;font:600 .85rem var(--sans)}
.num.visited{background:var(--moss)}

.pin.visited{background:var(--moss)}.pin.sel{background:var(--amber);color:var(--ink)}
textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,monospace}
.back{margin-bottom:8px;min-height:40px}

button,a.btn{font-family:var(--serif);letter-spacing:.02em}

  noGeo:"O teu navegador non permite a xeolocalización.", precision:a=>"A precisión é de ±"+a+" m. Gardar igualmente?",
  saved:a=>"Gardado (±"+a+" m).", noLoc:"Non se puido obter a localización.", noLocPerm:"Non se puido obter a túa localización. Revisa os permisos.",
  offline:"Sen conexión: móstrase o mapa gardado."},
 ca:{progress:(a,b)=>a+" de "+b+" visitats", next:"Propera parada", watchOff:"Activar seguiment", watchOn:"Seguiment actiu",
  visited:"Visitat", away:"a", editOn:"Mode edició", editOff:"Sortir del mode edició",
  none:"Encara no has capturat coordenades.", capLabel:"Coordenades capturades (copia-les i envia-me-les per fixar-les a l'app):",
  reset:"Esborrar el progrés de les visites", back:"← Tots els llocs", arrived:"Has arribat a aquest lloc.",
  youAre:"Ets a", approx:"Ubicació aproximada.",
  locked:r=>"El contingut extra es desbloqueja en arribar (a menys de "+r+" m).",
  drive:"Com arribar-hi en cotxe", capture:"Desar la meva ubicació aquí", simulate:"Simular arribada", measuring:"Mesurant…",
  noGeo:"El teu navegador no permet la geolocalització.", precision:a=>"La precisió és de ±"+a+" m. Desar-ho igualment?",
  saved:a=>"Desat (±"+a+" m).", noLoc:"No s'ha pogut obtenir la ubicació.", noLocPerm:"No s'ha pogut obtenir la teva ubicació. Revisa els permisos.",
  offline:"Sense connexió: es mostra el mapa desat."}
};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v===null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let over=load("curuxas_coords",{}), visited=load("curuxas",[]), edit=load("curuxas_edit",false);
let lang=load("curuxas_lang",null); if(lang!=="gl"&&lang!=="ca") lang="ca";
let userPos=null, selected=null, watchId=null, markers={}, me=null, arrivedNow=new Set();
const $=id=>document.getElementById(id);
const tr=k=>T[lang][k];
const tx=o=>typeof o==="string"?o:(o[lang]||o.gl);
const places=()=>PLACES.map(p=>Object.assign({},p,over[p.id]||{}));
const get=id=>places().find(p=>p.id===id);
const fmt=d=>d<1000?Math.round(d)+" m":(d/1000).toFixed(1).replace(".",",")+" km";

const map=L.map("map").setView([42.91,-8.01],11);
map.attributionControl.setPrefix(false);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);

function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dLa=r(c-a),dLo=r(d-b);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const dTo=p=>userPos?dist(userPos.lat,userPos.lng,p.lat,p.lng):null;

function drawMarkers(fit){
  Object.values(markers).forEach(m=>m.remove()); markers={};
  places().forEach((p,i)=>{
    const cls="pin"+(visited.includes(p.id)?" visited":"")+(selected===p.id?" sel":"");
    const ic=L.divIcon({className:"",html:'<div class="'+cls+'">'+(i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]});
    markers[p.id]=L.marker([p.lat,p.lng],{icon:ic,title:tx(p.name)}).addTo(map).on("click",()=>showDetail(p.id));
  });
  $("progress").textContent=tr("progress")(visited.length,PLACES.length);
  if(fit) map.fitBounds(places().map(p=>[p.lat,p.lng]),{padding:[50,50]});
}
function nextStop(){return places().find(p=>!visited.includes(p.id))||places()[0];}

function showList(){
  selected=null; drawMarkers();
  const el=$("panel"); el.innerHTML="";
  const top=document.createElement("div"); top.className="btns";
  const nb=document.createElement("button"); nb.className="primary"; nb.textContent=tr("next");
  nb.onclick=()=>showDetail(nextStop().id);
  const wb=document.createElement("button"); wb.id="watch"; wb.textContent=watchId===null?tr("watchOff"):tr("watchOn");
  if(watchId!==null) wb.className="on"; wb.onclick=toggleWatch;
  top.append(nb,wb); el.append(top);
  places().forEach((p,i)=>{
    const r=document.createElement("div"); r.className="row"; r.tabIndex=0;
    const d=dTo(p), v=visited.includes(p.id);
    r.innerHTML='<div class="num'+(v?" visited":"")+'">'+(i+1)+'</div><div><b></b><small></small></div>';
    r.querySelector("b").textContent=tx(p.name);
    r.querySelector("small").textContent=(v?tr("visited")+" · ":"")+(d!==null?tr("away")+" "+fmt(d):tx(p.short));
    r.onclick=()=>showDetail(p.id); r.onkeydown=e=>{if(e.key==="Enter")showDetail(p.id)};
    el.append(r);
  });
  const ed=document.createElement("div"); ed.style.marginTop="12px";
  const eb=document.createElement("button"); eb.textContent=edit?tr("editOff"):tr("editOn");
  eb.onclick=()=>{edit=!edit;save("curuxas_edit",edit);showList();}; ed.append(eb);
  el.append(ed);
  if(edit){
    const ta=document.createElement("textarea"); ta.readOnly=true;
    ta.value=Object.keys(over).length?JSON.stringify(over,null,1):tr("none");
    const lbl=document.createElement("div"); lbl.className="meta"; lbl.style.marginTop="10px";
    lbl.textContent=tr("capLabel");
    const rs=document.createElement("button"); rs.textContent=tr("reset"); rs.style.marginTop="8px";
    rs.onclick=()=>{visited=[];arrivedNow.clear();save("curuxas",visited);showList();};
    el.append(lbl,ta,rs);
  }
}

function showDetail(id,arrival){
  selected=id; const p=get(id); drawMarkers();
  const d=dTo(p), done=visited.includes(id), dest=p.lat+","+p.lng;
  const el=$("panel"); el.innerHTML="";
  const back=document.createElement("button"); back.className="back"; back.textContent=tr("back"); back.onclick=showList; el.append(back);
  if(arrival){const a=document.createElement("div");a.className="box arrive";a.textContent=tr("arrived");el.append(a);}
  const h=document.createElement("h2"); h.textContent=tx(p.name);
  const m=document.createElement("div"); m.className="meta";
  m.textContent=tx(p.short)+(d!==null?" "+tr("youAre")+" "+fmt(d)+".":"")+(p.approx?" "+tr("approx"):"");
  const t=document.createElement("p"); t.textContent=tx(p.info);
  el.append(h,m,t);
  const u=document.createElement("div"); u.className="box";
  u.textContent=done?tx(p.extra):tr("locked")(p.radius||DEFAULT_RADIUS);
  el.append(u);
  const b=document.createElement("div"); b.className="btns";
  const link=(txt,href,cls)=>{const a=document.createElement("a");a.className="btn "+(cls||"");a.textContent=txt;a.href=href;a.target="_blank";a.rel="noopener";return a;};
  b.append(link(tr("drive"),"https://www.google.com/maps/dir/?api=1&destination="+dest+"&travelmode=driving","primary"),
           link("Waze","https://waze.com/ul?ll="+dest+"&navigate=yes"),
           link("Apple Maps","https://maps.apple.com/?daddr="+dest+"&dirflg=d"));
  el.append(b);
  if(edit){
    const c=document.createElement("div"); c.className="btns";
    const cap=document.createElement("button"); cap.textContent=tr("capture"); cap.onclick=()=>capture(id,cap);
    const sim=document.createElement("button"); sim.textContent=tr("simulate");
    sim.onclick=()=>{if(!visited.includes(id)){visited.push(id);save("curuxas",visited);}showDetail(id,true);};
    c.append(cap,sim); el.append(c);
  }
  map.setView([p.lat,p.lng],Math.max(map.getZoom(),14));
}

function capture(id,btn){
  if(!navigator.geolocation){alert(tr("noGeo"));return;}
  btn.textContent=tr("measuring");
  navigator.geolocation.getCurrentPosition(pos=>{
    const acc=Math.round(pos.coords.accuracy);
    if(acc>30&&!confirm(tr("precision")(acc))){btn.textContent=tr("capture");return;}
    over[id]={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),radius:DEFAULT_RADIUS,approx:false,acc:acc};
    save("curuxas_coords",over); showDetail(id); alert(tr("saved")(acc));
  },()=>{btn.textContent=tr("capture");alert(tr("noLoc"));},{enableHighAccuracy:true,timeout:25000,maximumAge:0});
}

function onPos(pos){
  userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};
  if(!me) me=L.circleMarker([userPos.lat,userPos.lng],{radius:8,color:"#4a3524",fillColor:"#d9a441",fillOpacity:1}).addTo(map);
  else me.setLatLng([userPos.lat,userPos.lng]);
  const hit=places().find(p=>!arrivedNow.has(p.id)&&dTo(p)<=(p.radius||DEFAULT_RADIUS));
  if(hit){
    arrivedNow.add(hit.id);
    if(!visited.includes(hit.id)){visited.push(hit.id);save("curuxas",visited);}
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    showDetail(hit.id,true);
  } else if(selected) showDetail(selected); else showList();
}
function toggleWatch(){
  if(!navigator.geolocation){alert(tr("noGeo"));return;}
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;showList();return;}
  watchId=navigator.geolocation.watchPosition(onPos,()=>{alert(tr("noLocPerm"));watchId=null;showList();},
    {enableHighAccuracy:true,maximumAge:5000});
  showList();
}

// ---- Idioma ----
function applyLang(){
  document.documentElement.lang=lang;
  $("offline").textContent=tr("offline");
  document.querySelectorAll("#lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===lang)));
}
function setLang(l){lang=l;save("curuxas_lang",l);applyLang();if(selected)showDetail(selected);else showList();}
[["gl","GZ","Galego"],["ca","CA","Català"]].forEach(([l,txt,name])=>{
  const b=document.createElement("button"); b.dataset.l=l; b.textContent=txt; b.setAttribute("aria-label",name); b.title=name;
  b.onclick=()=>setLang(l); $("lang").append(b);
});
applyLang(); drawMarkers(true); showList();

const offBar=$("offline"), netState=()=>{offBar.hidden=navigator.onLine;};
addEventListener("online",netState);addEventListener("offline",netState);netState();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e)));}
</script>
</body>
